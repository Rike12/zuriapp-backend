name: Backend CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build -t zuri-backend:ci .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: zuri-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
